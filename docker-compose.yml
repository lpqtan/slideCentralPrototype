services:
  mongo:
    image: mongo:7
    container_name: mongo-test
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: slide-central
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=slidecentral
    depends_on:
      - mongo

volumes:
  mongo-data:
