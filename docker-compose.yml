services:
  mongo:
    image: mongo:7
    container_name: mongo-test
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 5

  daemon:
    build:
      context: ./open-design
      dockerfile: ../Dockerfile.daemon
    container_name: slide-central-daemon
    ports:
      - "7456:7456"
    volumes:
      - daemon-data:/app/.od
    environment:
      - NODE_ENV=production
      - OD_BIND_HOST=0.0.0.0
      - OD_PORT=7456
      - OD_DATA_DIR=/app/.od
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7456/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slide-central
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=slidecentral
      - DAEMON_URL=http://daemon:7456
    depends_on:
      mongo:
        condition: service_healthy
      daemon:
        condition: service_healthy

volumes:
  mongo-data:
  daemon-data:
